name: CI


on: 
   push:
	branches: [ main ]
   pull_requests:
	branches: [ main ] 

jobs:
   build-and-test:
	runs-on: ubuntu-latest
	env:
	   DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
	   IMAGE_NAME: flask-app

	steps:

	 - name: Check out repository 
	   uses: actions/checkout@v4

	- name: Set up Python
	  uses: actions /setup-python@v5
	  with:
	    python-version: "3.12"
	    cache: pip

	- name: Install dependencies
	  run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt pytest

	-name: Run Integration Test
        run: pytest integration_test.py -v

      - name: Run Smoke Test
        run: pytest smoke_test.py -v

      - name: Run Unit Test
        run: pytest unit_test.py -v
		
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test

      - name: Launch container and check it responds
        run: |
          docker run -d --name flask-test -p 5000:5000 ${{ env.IMAGE_NAME }}:test
          for i in $(seq 1 15); do
            status=$(docker inspect -f '{{.State.Running}}' flask-test)
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/ || true)
            if [ "$status" = "true" ] && [ "$code" != "000" ]; then
              echo "Container is running and responding (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to start"
          docker logs flask-test
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f flask-test || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:test $DH_USER/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:test $DH_USER/${{ env.IMAGE_NAME }}:latest
          docker push $DH_USER/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push $DH_USER/${{ env.IMAGE_NAME }}:latest






