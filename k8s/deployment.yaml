apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ml-app
  labels:
    app: weather-ml-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-ml-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: weather-ml-app
    spec:
      containers:
        - name: weather-ml-app
          image: ${IMAGE}
          ports:
            - containerPort: 5000   # change to the port your app listens on
          readinessProbe:
            httpGet:
              path: /health         # change to a real endpoint in your app
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
