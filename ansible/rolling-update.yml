---
- name: Perform rolling update of Weather ML application
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: Trigger rolling restart of application
      ansible.builtin.command:
        cmd: kubectl rollout restart deployment/weather-ml-app
      register: restart_result
      changed_when: true

    - name: Display restart result
      ansible.builtin.debug:
        var: restart_result.stdout

    - name: Wait for rolling update to complete
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/weather-ml-app --timeout=180s
      changed_when: false

    - name: Check deployment status
      ansible.builtin.command:
        cmd: kubectl get deployments
      register: deployment_status
      changed_when: false

    - name: Display deployment status
      ansible.builtin.debug:
        var: deployment_status.stdout_lines

    - name: Check running pods
      ansible.builtin.command:
        cmd: kubectl get pods
      register: pod_status
      changed_when: false

    - name: Display running pods
      ansible.builtin.debug:
        var: pod_status.stdout_lines
