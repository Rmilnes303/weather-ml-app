---
- name: Install kubectl
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - python3-apt
        state: present
        update_cache: true

    - name: Download Kubernetes signing key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: '0644'

    - name: Convert signing key to GPG format
      ansible.builtin.command:
        cmd: gpg --dearmor -o /usr/share/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
        creates: /usr/share/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/usr/share/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
        owner: root
        group: root
        mode: '0644'

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present
        update_cache: true
